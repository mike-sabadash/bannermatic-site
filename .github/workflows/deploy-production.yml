name: Deploy Bannermatic Production
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/bannermatic_server
          chmod 600 ~/.ssh/bannermatic_server
          ssh-keyscan -p 22 213.182.208.29 >> ~/.ssh/known_hosts
      - name: Configure Nginx
        run: |
          ssh -i ~/.ssh/bannermatic_server root@213.182.208.29 'bash -s' <<'SERVER'
          set -e
          mkdir -p /var/www/bannermatic
          test -f /etc/letsencrypt/live/bannermatic.rechord.online/fullchain.pem
          cat >/etc/nginx/sites-available/bannermatic.rechord.online <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name bannermatic.rechord.online;
            return 301 https://$host$request_uri;
          }
          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name bannermatic.rechord.online;
            root /var/www/bannermatic;
            index index.html;
            ssl_certificate /etc/letsencrypt/live/bannermatic.rechord.online/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/bannermatic.rechord.online/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          ln -sf /etc/nginx/sites-available/bannermatic.rechord.online /etc/nginx/sites-enabled/bannermatic.rechord.online
          nginx -t
          systemctl reload nginx
          SERVER
      - name: Deploy
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/bannermatic_server" dist/ root@213.182.208.29:/var/www/bannermatic/
          ssh -i ~/.ssh/bannermatic_server root@213.182.208.29 'nginx -t && systemctl reload nginx'
      - name: Smoke test
        run: |
          curl --fail --retry 8 --retry-delay 3 https://bannermatic.rechord.online/ | grep -q '<div id="root"></div>'
